<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Listas de HTML</h1>
    <p>Exemplos de lista não ordenada</p>


    <ul>
     <li>Pera</li>
     <li>Uva</li>
     <li>Maçã</li>
    </ul>
    <p>Exemplos de Lista ordenada</p>

    <ol>
        <li>Banana</li>
        <li>Morango</li>
        <li>Laranja</li>
        </ol>
        <p>Exemplos de lista descritiva</p>

        <dl>
            <dt>Café</dl>
            <dd>O café possui cafeina.</dd>
            <dt>Leite</dl>
            <dd> O leite é branco.</dd>
            </dl>

</body>
</html>
